# Validation pipeline for @zakhmban/ui (C2).
#
# Validation only. Frozen Technical Architecture v1.1 §2.2 makes dist/ a
# committed artifact that consumers install as-is, so there is nothing here to
# publish: no release, no tag, no npm registry, no deployment, and no secret.
# The pipeline's whole job is to prove that what is committed is what the
# source builds.
#
# Third-party actions are pinned by commit SHA rather than a tag, matching the
# convention already in use in zakhmban-therapists. A tag can be re-pointed
# upstream; a SHA cannot. The version comment beside each pin is provenance
# only — the SHA is what runs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json engines is `>=22 <23`, and .npmrc sets
          # engine-strict=true, so a runner outside that range fails the
          # install rather than building the committed artifact on the wrong
          # toolchain.
          node-version: "22"

      - name: Enable pnpm
        # The version comes from the `packageManager` field in package.json,
        # so it is stated once and cannot drift between here and a developer
        # machine.
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify committed dist/
        # Rebuilds and fails if the committed artifact differs from what this
        # source produces. Runs after `build` deliberately: `build` proves the
        # compile succeeds at all, this proves the result is the one four
        # consuming applications will install.
        run: pnpm verify:dist
